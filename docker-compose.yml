services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobpilot-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobpilot_dev}
      POSTGRES_DB: ${POSTGRES_DB:-jobpilot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobpilot} -d ${POSTGRES_DB:-jobpilot}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot-net

  redis:
    image: redis:7-alpine
    container_name: jobpilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jobpilot-net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  jobpilot-net:
    driver: bridge
